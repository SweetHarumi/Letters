<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Cartas</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: black;
    color: white;
    overflow: hidden;
}

/* fundo preto + leve brilho */
.container {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

/* botões */
.tabs {
    margin-bottom: 20px;
}

button {
    margin: 5px;
    padding: 10px 18px;
    border: 1px solid white;
    cursor: pointer;
    background: transparent;
    color: white;
    border-radius: 8px;
    transition: 0.3s;
}

button:hover {
    background: white;
    color: black;
}

/* caixa principal */
.card-box {
    display: flex;
    align-items: center;
    gap: 20px;
    width: 700px;
    padding: 25px;
    border: 1px solid white;
    border-radius: 15px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(6px);

    opacity: 1;
    transition: opacity 0.5s ease, transform 0.5s ease;
}

/* animação fade */
.fade-out {
    opacity: 0;
    transform: translateY(10px);
}

/* imagem pequena */
.photo {
    width: 140px;
    height: 140px;
    object-fit: cover;
    border-radius: 12px;
    border: 1px solid white;
}

/* texto */
.text {
    white-space: pre-line;
    flex: 1;
}

/* título */
h1 {
    margin-bottom: 20px;
}
</style>
</head>

<body>

<div class="container">

<h1>💌 5 anos com vocês</h1>

<div class="tabs">
    <button onclick="show('suna')">Suna</button>
    <button onclick="show('atsumu')">Atsumu</button>
    <button onclick="show('ushijima')">Ushijima</button>
    <button onclick="show('kita')">Kita</button>
</div>

<div class="card-box" id="cardBox">

    <img id="photo" class="photo" src="https://images.unsplash.com/photo-1520975916090-3105956dac38">

    <div class="text" id="text">
Clique em um nome acima 💖
    </div>

</div>

</div>

<script>

const data = {
suna: {
img: "https://images.unsplash.com/photo-1520975916090-3105956dac38",
text: `SUNA RINTARŌ

Você é silêncio, mas nunca vazio.
Você observa tudo, mesmo quando ninguém percebe.

Existe algo em você que protege sem esforço.
E eu vejo isso.

Obrigada por ficar.`
},

atsumu: {
img: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e",
text: `MIYA ATSUMU

Você é luz desorganizada.
Um caos bonito que transforma tudo ao redor.

Você faz o mundo parecer mais leve só por existir.

Obrigada por me fazer sorrir.`
},

ushijima: {
img: "https://images.unsplash.com/photo-1501785888041-af3ef285b470",
text: `USHIJIMA WAKATOSHI

Você é silêncio firme.
Presença constante.

Você não precisa falar muito para ser sentido.

Obrigada por permanecer.`
},

kita: {
img: "https://images.unsplash.com/photo-1496307042754-b4aa456c4a2d",
text: `KITA SHINSUKE

Você cuida de tudo.
Mesmo quando ninguém vê.

Você segura o mundo com calma.

Obrigada por ser casa.`
}
};

function show(name) {
    const box = document.getElementById("cardBox");

    // animação de saída
    box.classList.add("fade-out");

    setTimeout(() => {
        document.getElementById("photo").src = data[name].img;
        document.getElementById("text").innerText = data[name].text;

        // animação de entrada
        box.classList.remove("fade-out");
    }, 300);
}

</script>

</body>
</html>
