function show(name) {
    const photo = document.getElementById("photo");
    const text = document.getElementById("text");

    if (!data[name]) return;

    text.classList.add("fade");

    setTimeout(() => {
        photo.src = data[name].img;
        text.innerText = data[name].text;
        text.classList.remove("fade");
    }, 200);
