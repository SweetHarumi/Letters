<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>5 anos</title>

<style>
body {
    margin: 0;
    background: black;
    color: white;
    font-family: Arial, sans-serif;
}

/* topo */
.header {
    text-align: center;
    padding: 25px 10px;
}

.header h1 {
    margin: 0;
    font-size: 24px;
}

.header p {
    opacity: 0.6;
    margin-top: 5px;
}

/* abas */
.tabs {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    padding: 10px;
}

button {
    background: black;
    color: white;
    border: 1px solid white;
    padding: 8px 14px;
    cursor: pointer;
    border-radius: 6px;
    transition: 0.3s;
}

button:hover {
    background: white;
    color: black;
}

/* área principal */
.container {
    max-width: 700px;
    margin: auto;
    text-align: center;
    padding: 20px;
}

/* imagem */
.photo {
    width: 260px;
    height: 260px;
    object-fit: cover;
    border: 1px solid white;
    border-radius: 10px;
    margin-bottom: 20px;
}

/* texto */
.text {
    white-space: pre-line;
    text-align: left;
    line-height: 1.7;
    opacity: 1;
    transition: opacity 0.4s ease;
}

/* fade */
.fade {
    opacity: 0;
}
</style>
</head>

<body>

<div class="header">
    <h1>💌 5 anos</h1>
    <p>para os meus Momos</p>
</div>

<div class="tabs">
    <button onclick="show('suna')">Suna</button>
    <button onclick="show('atsumu')">Atsumu</button>
    <button onclick="show('ushijima')">Ushijima</button>
    <button onclick="show('kita')">Kita</button>
    <button onclick="show('kuroo')">Kuroo</button>
    <button onclick="show('all')">Todos</button>
</div>

<div class="container">

    <img id="photo" class="photo" src="imagens/capa.jpg">

    <div id="text" class="text">
Clique em uma aba para começar.
    </div>

</div>

<script>

const data = {

suna: {
img: "imagens/suna.jpg",
text: `Suna

(carta aqui — a versão que já escrevemos)`
},

atsumu: {
img: "imagens/atsumu.jpg",
text: `Atsumu

(carta aqui — a versão que já escrevemos)`
},

ushijima: {
img: "imagens/ushijima.jpg",
text: `Ushijima

(carta aqui — a versão que já escrevemos)`
},

kita: {
img: "imagens/kita.jpg",
text: `Kita

(carta aqui — a versão que já escrevemos)`
},

kuroo: {
img: "imagens/kuroo.jpg",
text: `Kuroo

(carta aqui — a versão que já escrevemos)`
},

all: {
img: "imagens/grupo.jpg",
text: `Todos vocês

Cinco anos.

Eu olho para tudo o que vivemos e percebo que não é só tempo.

É história.

É mudança.

É crescimento.

É amor.

Nos conhecemos por acaso, em um grupo, jogando, rindo, vivendo coisas simples que aos poucos se tornaram tudo.

Houve erros.

Houve brigas.

Houve distância.

Mas também houve escolha.

Escolha de ficar.

Escolha de continuar.

Escolha de reconstruir.

E isso mudou minha vida inteira.

Hoje vocês não são apenas pessoas importantes.

Vocês são parte de mim.

Parte da minha memória.

Parte da minha força.

Parte da minha vontade de continuar.

Museu.

Casa.

Japão.

Futuro.

Tudo isso ainda existe porque vocês existem comigo.

Obrigada por cinco anos.

E obrigada por permanecerem.`
}

};

function show(name) {
    const photo = document.getElementById("photo");
    const text = document.getElementById("text");

    text.classList.add("fade");

    setTimeout(() => {
        photo.src = data[name].img;
        text.innerText = data[name].text;
        text.classList.remove("fade");
    }, 200);
}

</script>

</body>
</html>
