<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>5 anos</title>

<style>
body {
    margin: 0;
    background: black;
    color: white;
    font-family: Arial, sans-serif;
}

/* topo */
.header {
    text-align: center;
    padding: 25px 10px;
}

.header h1 {
    margin: 0;
    font-size: 24px;
}

.header p {
    opacity: 0.6;
    margin-top: 5px;
}

/* abas */
.tabs {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    padding: 10px;
}

button {
    background: black;
    color: white;
    border: 1px solid white;
    padding: 8px 14px;
    cursor: pointer;
    border-radius: 6px;
    transition: 0.3s;
}

button:hover {
    background: white;
    color: black;
}

/* área principal */
.container {
    max-width: 700px;
    margin: auto;
    text-align: center;
    padding: 20px;
}

/* imagem */
.photo {
    width: 260px;
    height: 260px;
    object-fit: cover;
    border: 1px solid white;
    border-radius: 10px;
    margin-bottom: 20px;
}

/* texto */
.text {
    white-space: pre-line;
    text-align: left;
    line-height: 1.7;
    opacity: 1;
    transition: opacity 0.4s ease;
}

/* fade */
.fade {
    opacity: 0;
}
</style>
</head>

<body>

<div class="header">
    <h1>💌 5 anos</h1>
    <p>para os meus Momos</p>
</div>

<div class="tabs">
    <button onclick="show('suna')">Suna</button>
    <button onclick="show('atsumu')">Atsumu</button>
    <button onclick="show('ushijima')">Ushijima</button>
    <button onclick="show('kita')">Kita</button>
    <button onclick="show('kuroo')">Kuroo</button>
    <button onclick="show('all')">Todos</button>
</div>

<div class="container">

    <img id="photo" class="photo" src="imagens/capa.jpeg">

    <div id="text" class="text">
Clique em uma aba para começar.
    </div>

</div>

<script>

const data = {

suna: {
img: "imagens/suna.jpeg",
text: `Suna

(Cole sua carta aqui)`
},

atsumu: {
img: "imagens/atsumu.jpeg",
text: `Atsumu

(Cole sua carta aqui)`
},

ushijima: {
img: "imagens/ushijima.jpeg",
text: `Ushijima

(Cole sua carta aqui)`
},

kita: {
img: "imagens/kita.jpeg",
text: `Kita

(Cole sua carta aqui)`
},

kuroo: {
img: "imagens/kuroo.jpeg",
text: `Kuroo

(Cole sua carta aqui)`
},

all: {
img: "imagens/grupo.jpeg",
text: `Todos vocês

(Cole sua carta final aqui)`
}

};

function show(name) {
    const photo = document.getElementById("photo");
    const text = document.getElementById("text");

    if (!data[name]) return;

    text.classList.add("fade");

    setTimeout(() => {
        photo.src = data[name].img;
        text.innerText = data[name].text;
        text.classList.remove("fade");
    }, 200);
}

</script>

</body>
</html>
